# The incumbent: Qwen2.5-1.5B, the model that measured best on real scaling
# decisions (79% correct, 0% over-scaling - tests/e2e-local/results/).
#
# Served by llama.cpp on CPU. Modelplane wires the :8000 port and the /health
# probe itself, and the XRD rejects ports, probes, resources and volumes in the
# container template - so --port 8000 is set on the engine instead, because
# llama.cpp defaults to 8080.
#
# No volume means no weight cache, so each pod re-downloads on restart. A
# ModelCache would fix that, but it needs an RWX StorageClass which kind's
# default local-path is not.
apiVersion: v1
kind: Namespace
metadata:
  name: ml-team
---
apiVersion: modelplane.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: scaler-incumbent
  namespace: ml-team
spec:
  replicas: 1
  template:
    spec:
      engines:
      - name: qwen15
        members:
        - role: Standalone
          nodeSelector:
            devices:
            - name: gpu
              count: 1
              selectors:
              # Matched against the InferenceClass devices block, not against
              # pod resource requests. The example driver publishes 80Gi.
              - cel: |
                  device.capacity["gpu.example.com"].memory.compareTo(quantity("20Gi")) >= 0
          template:
            spec:
              containers:
              - name: engine
                image: ghcr.io/ggml-org/llama.cpp:server
                args:
                - "-hf"
                - "Qwen/Qwen2.5-1.5B-Instruct-GGUF:q4_k_m"
                - "--host"
                - "0.0.0.0"
                - "--port"
                - "8000"
                # The KV cache is SHARED across slots (kv_unified=true), and
                # llama.cpp starts 4 slots by default. A real SQLInstance -
                # with six CloudWatch metrics and atProvider state - renders to
                # ~3,200 prompt tokens, so 4 concurrent Operations need ~12,800.
                # At 8192 they oversubscribe it: requests wedge in
                # PipelineRunning for minutes and llama.cpp returns
                #   500 Context size has been exceeded
                # Worse, under that pressure the model starts copying a
                # few-shot example's name/namespace instead of the watched
                # resource - measured 5 of 8 Operations at 8-way concurrency.
                # function-openai's identity guard refuses those, but the
                # engine must be sized so it does not happen.
                - "--ctx-size"
                - "16384"
                - "--jinja"
                - "--temp"
                - "0"
                - "--alias"
                - "qwen"
                # Cap generation at the ENGINE. function-openai sends no
                # max_tokens, so without this the model generates until it
                # exhausts --ctx-size and llama.cpp reports
                #   decode() failed: Context size has been exceeded
                # while the Operation hangs in PipelineRunning. Measured: a
                # scaling decision never returned until this was set.
                - "--n-predict"
                - "256"

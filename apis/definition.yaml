apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: sqlinstances.aws.platform.upbound.io
spec:
  scope: Namespaced
  group: aws.platform.upbound.io
  names:
    kind: SQLInstance
    plural: sqlinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    region:
                      type: string
                      description: Region is the region you'd like your resource to be created in.
                    managementPolicies:
                      description: ManagementPolicies for the RDS resources. Defaults to ["*"] which includes all operations (Create, Observe, Update, Delete, LateInitialize). To orphan resources on deletion, use ["Create", "Observe", "Update", "LateInitialize"].
                      type: array
                      items:
                        type: string
                        enum:
                          - "*"
                          - Create
                          - Observe
                          - Update
                          - Delete
                          - LateInitialize
                      default: ["*"]
                    providerConfigName:
                      description: Crossplane ProviderConfig to use for provisioning this resources
                      type: string
                      default: default
                    engine:
                      type: string
                      description: This RDS Instance engine, see https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateDBInstance.html for possible values.
                      enum:
                        - postgres
                        - mariadb
                    engineVersion:
                      type: string
                      description: This RDS Instance engine version, see https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateDBInstance.html for possible values.
                    storageGB:
                      type: integer
                    instanceClass:
                      type: string
                      description: The instance class for the RDS instance, such as db.t3.micro, db.t3.small, etc.
                      default: "db.t3.micro"
                    passwordSecretRef:
                      type: object
                      description: "A reference to the Secret object containing database password. In v2, namespace is inferred from the resource namespace."
                      properties:
                        namespace:
                          type: string
                          description: "Deprecated in v2 - namespace is now inferred from resource namespace"
                        name:
                          type: string
                        key:
                          type: string
                      required:
                        - name
                        - key
                    autoGeneratePassword:
                      type: boolean
                    publiclyAccessible:
                      type: boolean
                      description: Whether the database should be publicly accessible from the internet
                      default: false
                    networkRef:
                      type: object
                      description: "A reference to the Network object that this database should be connected to."
                      properties:
                        id:
                          type: string
                          description: ID of the Network object this ref points to.
                      required:
                        - id
                  required:
                    - region
                    - engine
                    - engineVersion
                    - storageGB
                    - networkRef
                    - passwordSecretRef
              required:
                - parameters
            status:
              type: object
              properties:
                performanceMetrics:
                  type: object
                  description: Performance metrics from CloudWatch for this RDS instance
                  x-kubernetes-preserve-unknown-fields: true
                observedInstanceClass:
                  type: string
                  description: >-
                    The instance class the RDS instance actually reports, as
                    opposed to the one requested in
                    spec.parameters.instanceClass. The scaling analysis compares
                    the two: while they differ, a change is still in flight and
                    no new decision is made. This is what replaces a wall-clock
                    cooldown, which an LLM cannot evaluate because it has no
                    clock.
                observedInstanceStatus:
                  type: string
                  description: >-
                    The RDS instance's reported lifecycle status, e.g.
                    "available", "modifying", "backing-up". A second gate on
                    top of observedInstanceClass, covering changes AWS makes
                    that are not a class change.
                recommendedInstanceClass:
                  type: string
                  description: >-
                    The instance class the documented thresholds imply, computed
                    by the embedded function from scalingSignals and the
                    convergence gates. Every rule involved is arithmetic and
                    string comparison, so this needs no model - and a real run
                    showed a 1.5B getting it wrong in the expensive direction.
                    Published so a model's output can be checked against it, and
                    so anything that wants to enforce rather than suggest has
                    something to enforce. Equals observedInstanceClass when no
                    change is warranted. Nothing consumes it yet.
                scalingSignals:
                  type: object
                  description: >-
                    CloudWatch metrics expressed as percentages of the observed
                    instance class's capacity, which is the form the scaling
                    rules are written in. Computed by the embedded function, not
                    by the model. A real run scaled a database that needed
                    nothing because "FreeableMemory under 15% of class memory"
                    silently required the model to know db.t3.micro is 1 GiB and
                    divide; at 205 MiB free - 20.0%, above the threshold - it
                    read the absolute number as low. These fields turn that into
                    a comparison of two numbers. Absent for an instance class
                    the function has no capacity table for, so a missing value
                    means "unknown", never "zero".
                  properties:
                    cpuPercent:
                      type: number
                      description: CPUUtilization, already a percentage; copied through for symmetry.
                    freeableMemoryPercent:
                      type: number
                      description: FreeableMemory as a percentage of the class's memory.
                    connectionsPercent:
                      type: number
                      description: >-
                        DatabaseConnections as a percentage of the class's
                        default max_connections, which MySQL and MariaDB derive
                        as {DBInstanceClassMemory/12582880}.
                    classMemoryBytes:
                      type: integer
                      description: The observed class's memory, for auditing the percentage above.
                    classMaxConnections:
                      type: integer
                      description: The observed class's default max_connections, likewise.

# The exact input that made a real deployment resize a database for no reason.
#
# Captured from the AWS run in tests/e2e-local/results/aws-cloud-run.md: a real
# db.t3.micro, idle, which the model moved to db.t3.small. None of the prompt's
# up-conditions were met:
#
#   CPUUtilization      29.67%              vs > 80    NOT MET
#   DatabaseConnections 0                   vs > 80%   NOT MET
#   FreeableMemory      215220224 (205 MiB) = 20.0% of the class's 1 GiB,
#                                           vs < 15%   NOT MET
#
# 205 MiB reads low in absolute terms, which is the trap. Rendering this must
# produce status.scalingSignals.freeableMemoryPercent: 20.0, so the rule the
# model is asked to apply becomes a comparison rather than a recall of AWS
# instance specs followed by a division.
apiVersion: aws.platform.upbound.io/v1alpha1
kind: SQLInstance
metadata:
  name: rds-metrics-database-ai-mysql
  namespace: database-team
  labels:
    scale: me
spec:
  parameters:
    region: us-west-2
    engine: mariadb
    engineVersion: "10.11"
    storageGB: 5
    instanceClass: db.t3.micro
    autoGeneratePassword: true
    passwordSecretRef:
      name: mariadbsecret
      key: password
    networkRef:
      id: rds-metrics-database-ai-scale
status:
  observedInstanceClass: db.t3.micro
  observedInstanceStatus: available
  performanceMetrics:
    databaseName: rds-metrics-database-ai-mysql
    region: us-west-2
    metrics:
      CPUUtilization:
        value: 29.66877438210402
        unit: Percent
      DatabaseConnections:
        value: 0
        unit: Count
      FreeableMemory:
        value: 215220224
        unit: Bytes
      FreeStorageSpace:
        value: 3544797184
        unit: Bytes
